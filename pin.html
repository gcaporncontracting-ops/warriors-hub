<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cockburn Lakes Warriors — PIN Management</title>
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#132a6e; --navy-deep:#0b1c4d; --red:#d62828; --blue:#1d4fd8; --gold:#f2b134; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans', sans-serif; color:#fff; min-height:100vh;
    background-color:#050810;
    background-image:url('/wallpaper.jpg');
    background-size:cover; background-position:top center;
    background-attachment:fixed; background-repeat:no-repeat;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 20px 80px;}
  header.top{ text-align:center; padding:24px 0 10px; }
  .hero-banner{ width:100%; max-width:320px; margin:0 auto; }
  .hero-banner img{ width:100%; display:block; border-radius:10px; }
  .back-link{
    display:inline-block; margin:16px 0 4px; color:#aaa; text-decoration:none;
    font-family:'JetBrains Mono', monospace; font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
  }
  .back-link:hover{ color:#fff; }
  .ctt-card {
    background: rgba(6, 10, 24, 0.78); border-radius: 16px; padding: 20px;
    border: 2px solid var(--gold); margin-top: 20px;
    box-shadow: 0 0 18px rgba(242, 177, 52, 0.35);
  }
  .ctt-card h2 { font-family: 'Anton', sans-serif; text-transform: uppercase; font-size: 20px; margin: 0 0 12px; }
  .ctt-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .ctt-row input, .pin-fields input {
    flex: 1; background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 8px; padding: 10px; color: #fff; font-family: 'Work Sans', sans-serif;
  }
  .ctt-submit {
    background: var(--red); color: #fff; border: none; border-radius: 8px; padding: 10px 20px;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 0 #9c1c1c; text-transform: uppercase;
  }
  .ctt-submit:active { transform: translateY(2px); box-shadow: 0 2px 0 #9c1c1c; }
  .ctt-submit:disabled{ opacity:0.6; cursor:not-allowed; }
  .ctt-status { font-size: 12px; margin-top: 8px; min-height:14px; }
  .ctt-status.ok { color: #7fe0a3; }
  .ctt-status.err { color: #ff8a8a; }
  footer { text-align:center; padding:60px 0 20px; opacity:0.4; font-size:12px; font-family:'JetBrains Mono',monospace; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="hero-banner"><img src="/crest.png" alt="Warriors Crest"></div>
    <a class="back-link" href="/">&larr; Back to Hub</a>
  </header>

  <div class="ctt-card">
    <h2>PIN Management</h2>
    <div class="pin-fields" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
      <div>
        <label style="font-size:10px; opacity:0.6; display:block; margin-bottom:4px; font-family:'JetBrains Mono',monospace;">CURRENT PIN</label>
        <input type="tel" id="pinCurrentInput" inputmode="numeric" maxlength="4" style="width:100%; text-align:center; font-size:20px; letter-spacing:4px;">
      </div>
      <div>
        <label style="font-size:10px; opacity:0.6; display:block; margin-bottom:4px; font-family:'JetBrains Mono',monospace;">NEW PIN</label>
        <input type="tel" id="pinNewInput" inputmode="numeric" maxlength="4" style="width:100%; text-align:center; font-size:20px; letter-spacing:4px;">
      </div>
    </div>
    <button type="button" class="ctt-submit" id="pinChangeSubmit" style="width:100%;">Update PIN</button>
    <p class="ctt-status" id="pinChangeStatus"></p>

    <hr style="border:none; border-top:1px solid rgba(255,255,255,0.1); margin:20px 0;">

    <label style="font-size:10px; opacity:0.6; display:block; margin-bottom:5px; font-family:'JetBrains Mono',monospace;">FORGOT PIN? ENTER NAME:</label>
    <div class="ctt-row">
      <input type="text" id="pinRequestName" placeholder="Full Name (as registered with the club)">
      <button type="button" class="ctt-submit" id="pinRequestSubmit">Request</button>
    </div>
    <p class="ctt-status" id="pinRequestStatus"></p>
    
    <div style="margin-top: 24px; text-align: center;">
      <a href="/suggestion.html" style="color: var(--red); font-family: 'JetBrains Mono', monospace; font-size: 12px; text-transform: uppercase; text-decoration: none; border: 1px solid var(--red); padding: 8px 16px; border-radius: 8px;">Got an idea? Submit a Suggestion</a>
    </div>
  </div>

  <footer>&copy; 2026 Cockburn Lakes Warriors Hub</footer>
</div>

<script>
  // Same-origin — no backend URL needed, this talks directly to the hub Worker's
  // existing /api/change-pin and /api/pin-request routes.
  function setStatus(el, msg, ok){ el.textContent = msg; el.className = 'ctt-status ' + (ok ? 'ok' : 'err'); }

  document.getElementById('pinChangeSubmit').addEventListener('click', async () => {
    const oldPin = document.getElementById('pinCurrentInput').value.trim();
    const newPin = document.getElementById('pinNewInput').value.trim();
    const status = document.getElementById('pinChangeStatus');
    const btn = document.getElementById('pinChangeSubmit');

    if (!/^\d{4}$/.test(oldPin) || !/^\d{4}$/.test(newPin)) {
      setStatus(status, 'Enter valid 4-digit PINs', false);
      return;
    }

    btn.disabled = true;
    setStatus(status, 'Updating...', true);
    try {
      const res = await fetch('/api/change-pin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ oldPin, newPin })
      });
      const data = await res.json();
      if (data.success) {
        setStatus(status, 'PIN Updated!', true);
        document.getElementById('pinCurrentInput').value = '';
        document.getElementById('pinNewInput').value = '';
      } else {
        setStatus(status, data.error || 'Error updating PIN', false);
      }
    } catch (e) {
      setStatus(status, 'Network error', false);
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById('pinRequestSubmit').addEventListener('click', async () => {
    const name = document.getElementById('pinRequestName').value.trim();
    const status = document.getElementById('pinRequestStatus');
    const btn = document.getElementById('pinRequestSubmit');
    if (!name) { setStatus(status, 'Enter your name', false); return; }

    btn.disabled = true;
    setStatus(status, 'Sending...', true);
    try {
      const res = await fetch('/api/pin-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      const data = await res.json();
      if (data.ok) {
        setStatus(status, data.message || 'Request sent!', true);
        document.getElementById('pinRequestName').value = '';
      } else {
        setStatus(status, data.error || 'Error sending request', false);
      }
    } catch (e) {
      setStatus(status, 'Network error', false);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>

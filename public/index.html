<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warriors Hub — First Goal</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0b1c4d">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Warriors Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;600;700&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132a6e;
    --navy-deep:#0b1c4d;
    --red:#d62828;
    --blue:#1d4fd8;
    --gold:#f2b134;
    --ink:#14161c;
    --paper:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    color:#fff;
    min-height:100vh;
    background-color:#050810;
    background-image:url('/wallpaper.jpg');
    background-size:cover;
    background-position:top center;
    background-attachment:fixed;
    background-repeat:no-repeat;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 20px 80px;}
  header.top{
    text-align:center;
    padding:10px 0 20px;
    color:#fff;
  }
  .hero-banner{
    width:100%;
    max-width:480px;
    margin:0 auto;
  }
  .hero-banner img{
    width:100%;
    display:block;
    border-radius:10px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    margin-top: 20px;
    width: 100%;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1 / 1;
    background: transparent;
    border: none !important;
    box-shadow: none !important;
    padding: 0;
    text-decoration: none;
    color: #fff;
    transition: transform 0.12s;
    position: relative;
    box-sizing: border-box;
    text-align: center;
    cursor: pointer;
  }

  .card:hover {
    transform: translateY(-5px);
  }

  .card img {
    width: 100%;
    height: auto;
    max-height: 85%;
    object-fit: contain;
    display: block;
    margin: 0 auto;
  }

  .card span {
    font-family: 'Anton', sans-serif;
    text-transform: uppercase;
    font-size: 16px;
    letter-spacing: 0.05em;
    color: #fff;
    margin-top: 8px;
  }

  footer{
    text-align:center;
    padding:60px 0;
    opacity:0.4;
    font-size:12px;
    font-family:'JetBrains Mono',monospace;
  }
  footer a { color:inherit; text-decoration:none; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="hero-banner">
      <img src="/hero.jpg" alt="Warriors Player Hub">
    </div>
  </header>

  <!-- MAIN GRID (ONLY FGS AND REQUEST PIN) -->
  <div class="grid">
    
    <!-- Card 1: First Goal -->
    <a class="card" href="/">
      <img src="icon-fgs.png" alt="Goal">
      <span>First Goal</span>
    </a>

    <!-- Card 2: Request PIN -->
    <a class="card" href="/pin.html">
      <img src="icon-pinchange.png" alt="PIN">
      <span>Request PIN</span>
    </a>

  </div>

  <footer>
    &copy; 2026 Cockburn Lakes Warriors Hub<br>
    <a href="/admin-pin.html">ADMIN LOGIN</a>
  </footer>
</div>

</body>
</html>
